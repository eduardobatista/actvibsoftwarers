[package]
name = "actvib"
version = "0.1.0"
edition = "2024"
description = "Monitoring and active control of laboratory vibration experiments (Rust port of ActVibSoftware)"
license = "MIT"
authors = ["Eduardo Batista"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-ipc = { version = "60.1.0", features = ["lz4", "zstd"] }
arrow-schema = "60.1.0"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_plot = "0.38.0"
espflash = { version = "4.7.0", default-features = false, features = ["serialport"] }
hex = "0.4.3"
nalgebra = "0.35.0"
rand = "0.10.3"
rand_distr = "0.6.0"
rfd = "0.18.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.11.1"
ureq = "3.5.2"
zip = "9.5.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
